name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VOICEMATOR_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          VOICEMATOR_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          VOICEMATOR_KEYSTORE_PASSWORD: ${{ secrets.VOICEMATOR_KEYSTORE_PASSWORD }}
          VOICEMATOR_KEY_ALIAS: ${{ secrets.VOICEMATOR_KEY_ALIAS }}
          VOICEMATOR_KEY_PASSWORD: ${{ secrets.VOICEMATOR_KEY_PASSWORD }}
        run: ./gradlew checkThirdPartyNotices lintRelease assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="voicemator-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --verify-tag --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
